      Ok. Câu chuyện hài hước:

      Có một ông cụ vào quán cà phê và hỏi:

      Cho tôi một ly cà phê, nhưng không đường, không sữa nhé!
      Người phục vụ đáp:

      Vậy ông uống nước lọc thôi ạ?
      Ông cụ cười:

      Đúng rồi, nhưng tôi thích gọi là \"cà phê không đường, không sữa\" cho sang!
